name: Verify dotfiles

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_UPGRADE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD
      - name: Install fixture dependencies
        run: brew install stow python coreutils ripgrep
      - name: Check shell syntax
        shell: bash
        run: |
          for file in install.sh scripts/agent-skills; do bash -n "$file"; done
          sh -n scripts/git-ssh-identity
          for file in zsh/.zsh{env,rc} zsh/.z{profile,login} zsh/.oh-my-zsh/custom/*.zsh; do
            zsh -f -n "$file"
          done
      - name: Run offline regressions and skill validation
        run: |
          python3 -B tests/test_regressions.py
          scripts/agent-skills audit
